name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./daemon[test]"
      - run: python -m pytest -q daemon/tests
