name: android-try
on:
  push:
    branches: [android-releases]
jobs:
  android:  # the phone app: a signed APK on the same release (the app checks GitHub's latest release for it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: python3 tools/stamp-version.py
      - run: npm ci
        working-directory: desktop
      - env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # the release key (build.gradle.kts reads it from here); never echoed
          K="$RUNNER_TEMP/keys"; mkdir -m 700 "$K"
          echo "$KEYSTORE" | base64 -d > "$K/release.jks"; printf %s "$KEYSTORE_PASSWORD" > "$K/password"
          echo "SWITCHBOARD_ANDROID_KEYS=$K" >> "$GITHUB_ENV"
      - run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npx tauri android build --apk --target aarch64
        working-directory: desktop
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk Switchboard.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs Switchboard.apk | grep "DN: CN=Switchboard"  # signed with our key
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Switchboard.apk
