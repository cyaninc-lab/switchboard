name: windows
# Only when something Windows-specific could break: the daemon, the native app, dependencies, tools, workflows.
# The UI and docs are covered by the Linux job. PRs only; run by hand from the Actions tab if needed.
on:
  pull_request:
    paths: [daemon/**, desktop/src-tauri/**, desktop/package.json, desktop/package-lock.json, tools/**, .github/workflows/**]
  workflow_dispatch:
jobs:
  changes:  # a release-only PR (version numbers and notes) needs no test run: the release build that follows catches breakage
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: c
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          # the files tools/stamp-version.py writes, plus VERSION and NOTES.md
          other=$(echo "$files" | grep -vxE 'VERSION|NOTES\.md|desktop/package\.json|desktop/src-tauri/(Cargo\.toml|Cargo\.lock|tauri\.conf\.json)|daemon/pyproject\.toml|daemon/switchboard_daemon/__init__\.py' || true)
          echo "code=$([ -n "$other" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e "./daemon[test]" pyinstaller
      - name: daemon tests on Windows
        run: python -m pytest -q daemon/tests
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: build the web app (the daemon bundles it)
        working-directory: desktop
        run: npm ci && npm run build
      - name: freeze the daemon (sidecar)
        run: PY=python daemon/build-sidecar.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: build the app
        working-directory: desktop
        run: npx tauri build --no-bundle
      - name: tauri-driver for driving the real window
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: collect
        run: |
          mkdir out
          cp desktop/src-tauri/target/release/switchboard.exe out/
          cp desktop/src-tauri/target/release/switchboard-daemon.exe out/
          cp ~/.cargo/bin/tauri-driver.exe out/
          ls -la out
      - uses: actions/upload-artifact@v6
        with:
          name: switchboard-windows
          path: out
