[project]
name = "switchboard-daemon"
license = "AGPL-3.0-only"
version = "0.1.27"
description = "Switchboard daemon: serves this machine's Claude Code sessions to Switchboard clients"
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk>=0.2.182", "aiohttp>=3.9", "pywinpty>=2.0; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
switchboard-daemon = "switchboard_daemon.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["switchboard_daemon"]
